<div class="gap-analysis-table-container app-table-scroll">
    <table mat-table [dataSource]="gapAnalyses" class="gap-analysis-table">
        <ng-container matColumnDef="programme">
            <th mat-header-cell *matHeaderCellDef>Programme</th>
            <td mat-cell *matCellDef="let gapAnalysis">
                <mat-form-field appearance="outline">
                    <textarea matInput [(ngModel)]="gapAnalysis.programme" rows="6"
                        aria-label="Programme"></textarea>
                </mat-form-field>
            </td>
        </ng-container>

        <ng-container matColumnDef="optimalAssets">
            <th mat-header-cell *matHeaderCellDef>Optimal Assets</th>
            <td mat-cell *matCellDef="let gapAnalysis">
                <mat-form-field appearance="outline">
                    <textarea matInput [(ngModel)]="gapAnalysis.optimalAssets" rows="6"
                        aria-label="Optimal Assets"></textarea>
                </mat-form-field>
            </td>
        </ng-container>

        <ng-container matColumnDef="gapOptimalAssetsUtilisedAssets">
            <th mat-header-cell *matHeaderCellDef>Gap between optimal assets and currently utilised assets</th>
            <td mat-cell *matCellDef="let gapAnalysis">
                <mat-form-field appearance="outline">
                    <textarea matInput [(ngModel)]="gapAnalysis.gapOptimalAssetsUtilisedAssets" rows="6"
                        aria-label="Gap between optimal assets and currently utilised assets"></textarea>
                </mat-form-field>
            </td>
        </ng-container>

        <ng-container matColumnDef="quantifiedNeedStatement">
            <th mat-header-cell *matHeaderCellDef>Quantified need statement</th>
            <td mat-cell *matCellDef="let gapAnalysis">
                <mat-form-field appearance="outline">
                    <textarea matInput [(ngModel)]="gapAnalysis.quantifiedNeedStatement" rows="6"
                        aria-label="Quantified need statement"></textarea>
                </mat-form-field>
            </td>
        </ng-container>

        <ng-container matColumnDef="priority">
            <th mat-header-cell *matHeaderCellDef>Priority</th>
            <td mat-cell *matCellDef="let gapAnalysis">
                <mat-form-field appearance="outline">
                    <textarea matInput [(ngModel)]="gapAnalysis.priority" rows="6"
                        aria-label="Priority"></textarea>
                </mat-form-field>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>

<div class="gap-analysis-actions">
    <button mat-raised-button color="primary" type="button" (click)="addGapAnalysis()">
        Add Gap Analysis
    </button>
</div>
