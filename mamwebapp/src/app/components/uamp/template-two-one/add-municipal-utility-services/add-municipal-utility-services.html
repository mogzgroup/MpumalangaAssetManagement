<h2 mat-dialog-title>Municipal Utility Services</h2>
<mat-dialog-content>
    <form [formGroup]="municipalUtilityServiceForm" class="service-form">
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <mat-select formControlName="name" placeholder="Please select">
                <mat-option *ngFor="let option of names" [value]="option">{{ option.name }}</mat-option>
            </mat-select>
            <mat-error *ngIf="municipalUtilityServiceForm.controls['name'].hasError('required')">Name is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Cost (ZAR)</mat-label>
            <input matInput type="number" min="0" step="0.01" formControlName="cost">
            <mat-error *ngIf="municipalUtilityServiceForm.controls['cost'].hasError('required')">Cost is required</mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" type="button" (click)="addMunicipalUtilityService()">
            <mat-icon>add</mat-icon>Add
        </button>
    </form>

    <div class="service-table-container">
        <table class="service-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Cost</th>
                    <th aria-label="Actions"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let service of municipalUtilityServices; let index = index">
                    <td>{{ service.name }}</td>
                    <td>{{ service.cost | currency:'ZAR':'R' }}</td>
                    <td>
                        <button mat-icon-button type="button" (click)="deleteMunicipalUtilityService(index)" aria-label="Delete service">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td></td>
                    <td>Total: {{ sum() | currency:'ZAR':'R' }}</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" type="button" (click)="onSubmit()">Submit</button>
</mat-dialog-actions>
