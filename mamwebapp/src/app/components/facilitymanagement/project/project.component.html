<div class="project-actions">
    <button mat-raised-button color="primary" *ngIf="currentUser?.roleId == 2 || currentUser?.roleId == 3"
        type="button" (click)="openNewProjectDialog()">
        <mat-icon>add</mat-icon>Add New
    </button>
</div>

<div class="project-filter">
    <mat-form-field appearance="outline">
        <mat-label>Search projects</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (input)="applyFilter($event.target.value)">
    </mat-form-field>
</div>

<div class="app-table-scroll project-table-scroll">
<table mat-table [dataSource]="dataSource" matSort>
    <ng-container *ngFor="let col of cols" [matColumnDef]="col.field">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{col.header}}</th>
        <td mat-cell *matCellDef="let rowData">{{rowData[col.field]}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let rowData">
            <button mat-icon-button [matMenuTriggerFor]="projectMenu" (click)="selectProject(rowData)"
                [disabled]="loading || deletingProject" [attr.aria-label]="'Actions for project ' + rowData.name">
                <mat-icon>more_vert</mat-icon>
            </button>
        </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length" class="project-table-state">
            <ng-container *ngIf="loading; else projectLoadResult">
                <mat-progress-bar mode="indeterminate" aria-label="Loading projects"></mat-progress-bar>
                <span>Loading projects...</span>
            </ng-container>
            <ng-template #projectLoadResult>
                <ng-container *ngIf="loadError; else projectEmptyState">
                    <span>No data found</span>
                    <button mat-button type="button" (click)="loadProjects()">
                        <mat-icon>refresh</mat-icon>Retry
                    </button>
                </ng-container>
                <ng-template #projectEmptyState>No data found</ng-template>
            </ng-template>
        </td>
    </tr>
</table>
</div>
<mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons
    aria-label="Select page of projects"></mat-paginator>

<mat-menu #projectMenu="matMenu">
    <button mat-menu-item type="button" (click)="viewProject()"><mat-icon>visibility</mat-icon>View</button>
    <button mat-menu-item type="button" (click)="printProject()"><mat-icon>print</mat-icon>Print</button>
    <button mat-menu-item type="button" (click)="updateProject()"><mat-icon>edit</mat-icon>Update</button>
    <button mat-menu-item type="button" (click)="confirmDeleteProject()">
        <mat-icon>delete</mat-icon>Delete
    </button>
</mat-menu>

<ng-template #projectDialog>
    <mat-card class="project-dialog">
        <mat-card-header>
            <mat-card-title>{{dialogHeader}}</mat-card-title>
            <button mat-icon-button aria-label="Close" (click)="closeProjectDialog()"><mat-icon>close</mat-icon></button>
        </mat-card-header>
        <mat-card-content>
            <app-add-edit-project (newAsset)="addUpdateAsset($event)" [project]="project"
                [isViewOnly]="dialogHeader === 'View Project'"></app-add-edit-project>
        </mat-card-content>
    </mat-card>
</ng-template>

<ng-template #deleteProjectDialog>
    <h2 mat-dialog-title>Confirm deletion</h2>
    <mat-dialog-content>Are you sure you want to delete this project?</mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button type="button" (click)="closeDeleteProjectDialog()"
            [disabled]="deletingProject">Cancel</button>
        <button mat-raised-button color="warn" type="button" (click)="deleteProject()"
            [disabled]="deletingProject">
            <mat-spinner *ngIf="deletingProject" diameter="18"></mat-spinner>
            <span>{{ deletingProject ? 'Deleting...' : 'Delete' }}</span>
        </button>
    </mat-dialog-actions>
</ng-template>
